- name: Commitear el dashboard actualizado
  run: |
    git config user.name "dashboard-bot"
    git config user.email "dashboard-bot@users.noreply.github.com"

    git add docs/index.html

    if git diff --staged --quiet; then
      echo "Sin cambios, no hay nada que commitear"
      exit 0
    fi

    git commit -m "Actualización automática del dashboard $(date -u +%Y-%m-%d)"

    git pull --rebase origin main
    git push origin main
